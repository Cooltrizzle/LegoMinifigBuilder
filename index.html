<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minifig Parts Tool</title>
  <script defer src="script.js"></script>
</head>
<body>
  <h1>Minifig Parts Lookup</h1>

  <div>
    <label>Rebrickable API Key:
      <input type="password" id="apiKeyInput">
    </label>
    <button id="saveApiKeyBtn">Save API Key</button>
  </div>

  <div>
    <label>Minifig ID (e.g. fig-000001):
      <input type="text" id="figInput">
    </label>
    <button id="fetchBtn">Fetch Parts</button>
  </div>

  <h2>Parts</h2>
  <pre id="output"></pre>
</body>
</html>
