<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minifig Parts & Element Lookup</title>
  <script defer src="script.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    table img { max-height: 50px; }
    h1, h2 { margin-top: 20px; }
    label { display: inline-block; margin: 5px 0; }
    input { margin-left: 5px; }
    button { margin-left: 5px; }
    .section { margin-top: 20px; padding-top: 10px; border-top: 1px solid #ddd; }

    /* Minifig summary box styling */
    .fig-summary-box {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ccc;
      background: #fafafa;
      border-radius: 8px;
    }
    .fig-summary-img {
      width: 120px;
      height: auto;
    }
    .fig-summary-text h2 {
      margin: 0 0 10px 0;
    }
  </style>
</head>
<body>

  <h1>Minifig Parts & Element Lookup</h1>

  <div class="section">
    <h2>API Key</h2>
    <label>
      Rebrickable API Key:
      <input type="password" id="apiKeyInput">
    </label>
    <button id="saveApiKeyBtn">Save API Key</button>
    <div id="apiKeyStatus"></div>
  </div>

  <!-- ⭐ REQUIRED NEW SECTION -->
  <div class="section">
    <h2>Load Data Files</h2>

    <label>Translator CSV:</label>
    <input type="file" id="translatorFile">
    <button id="loadTranslatorBtn">Load Translator</button>

    <br><br>

    <label>Minifigs CSV:</label>
    <input type="file" id="minfigsFile">
    <button id="loadMinfigsBtn">Load Minifigs</button>
  </div>

  <div class="section">
    <h2>Minifig Search</h2>
    <label>
      Minifig ID (BrickLink or Rebrickable):
      <input type="text" id="figInput">
    </label>
    <button id="fetchFigBtn">Fetch Parts</button>

    <!-- ⭐ Minifig Summary Box -->
    <div id="figSummary"></div>

    <!-- Parts table output -->
    <div id="figOutput"></div>
  </div>

  <div class="section">
    <h2>Element → Minifigs</h2>
    <label>
      Element ID:
      <input type="text" id="elementInput">
    </label>
    <button id="elementSearchBtn">Find Minifigs</button>
    <div id="elementOutput"></div>
  </div>

</body>
</html>
