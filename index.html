<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minifig Parts & Element Lookup</title>
  <script defer src="script.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    table img { max-height: 50px; }
    h1, h2 { margin-top: 20px; }
    label { display: inline-block; margin: 5px 0; }
    input { margin-left: 5px; }
    button { margin-left: 5px; }
    .section { margin-top: 20px; padding-top: 10px; border-top: 1px solid #ddd; }

    /* Minifig summary box styling */
    .fig-summary-box {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ccc;
      background: #fafafa;
      border-radius: 8px;
    }
    .fig-summary-img {
      width: 120px;
      height: auto;
    }
    .fig-summary-text h2 {
      margin: 0 0 10px 0;
    }
  </style>
</head>
<body>
  
  <h1>Minifig Parts & Element Lookup</h1
  
<div class="section">
  <h2 onclick="toggleApiSection()" id="apiKeyHeader" style="cursor:pointer;">
  API Key ▼ <span id="apiKeyTick" style="margin-left:6px;"></span>
</h2>


 <div id="apiSection" style="display:none; margin-top:10px;">
  <div style="display:flex; align-items:center; gap:10px;">
    <label style="margin:0;">
      Rebrickable API Key:
      <input type="password" id="apiKeyInput" style="margin-left:5px;">
    </label>
    <button id="saveApiKeyBtn">Save</button>
  </div>

  <div id="apiKeyStatus" style="margin-top:8px; display:flex; align-items:center; gap:6px;"></div>
</div>



  <div class="section">
    <h2>Minifig Search</h2>
    <label>
      Minifig ID (BrickLink or Rebrickable):
      <input type="text" id="figInput">
    </label>
    <button id="fetchFigBtn">Fetch Parts</button>
    <button id="updateTranslatorBtn">Update Database</button>

    <div id="figFilterList" class="filter-list"></div>
    <style>
  .filter-list {
    position: absolute;
    background: white;
    border: 1px solid #ccc;
    max-height: 200px;
    overflow-y: auto;
    width: 250px;
    display: none;
    z-index: 20;
  }
  .filter-item {
    padding: 6px;
    cursor: pointer;
  }
  .filter-item:hover {
    background: #eee;
  }
</style>   


    <!-- ⭐ Minifig Summary Box -->
    <div id="figSummary"></div>

    <!-- Parts table output -->
    <div id="figOutput"></div>
  </div>

  <div class="section">
    <h2>Element → Minifigs</h2>
    <label>
      Element ID:
      <input type="text" id="elementInput">
    </label>
    <button id="elementSearchBtn">Find Minifigs</button>
    <div id="elementOutput"></div>
  </div>

</body>
</html>
